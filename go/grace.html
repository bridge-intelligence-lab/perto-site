<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in WhatsApp — Perto</title>
<meta http-equiv="refresh" content="1;url=https://wa.me/message/SQAAXZ5ANSONC1">
<script data-goatcounter="https://perto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
/* A QR scan lands here so the visit is counted (cookieless), then goes straight to WhatsApp. */
(function () {
  var to = 'https://wa.me/message/SQAAXZ5ANSONC1', done = false, tries = 0;
  function go() { if (done) return; done = true; location.replace(to); }
  function tick() {
    tries++;
    if (window.goatcounter && window.goatcounter.count) {
      try { window.goatcounter.count({path: 'event/qr/grace', title: 'QR grace', event: true}); } catch (e) {}
      clearInterval(timer); go();
    } else if (tries > 8) { clearInterval(timer); go(); }
  }
  var timer = setInterval(tick, 100);
})();
</script>
<style>
  body { margin: 0; padding: 32px 16px; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f7f5f0; color: #1f2a24; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #11161a; color: #e8ebe9; } }
  a { display: inline-block; background: #1f5e46; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 18px; border-radius: 10px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <p>Perto · Grace Community Church</p>
  <p><a href="https://wa.me/message/SQAAXZ5ANSONC1">Open in WhatsApp</a></p>
  <p>Opening WhatsApp… If nothing happens, tap the button.</p>
</main>
</body>
</html>
